[project]
name = "ig-integration-client"
version = "0.2.0"
description = "Internal server-side IG integration helpers"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.15.1,<3", "requests>=2.32,<3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ig_client*"]

[tool.setuptools.package-data]
ig_client = ["py.typed"]
