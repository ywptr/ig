[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-queue"
version = "0.1.0"
description = "Internal work delivery and scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=8.1,<9",
    "rq>=2.12,<3",
    "vercel-queue==0.9.1",
    "vercel==0.11.5",
    "anyio>=4,<5",
]

[tool.setuptools.packages.find]
include = ["ig_queue*"]
