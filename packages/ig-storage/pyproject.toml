[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ig-storage"
version = "0.1.0"
description = "Internal byte and object storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "vercel==0.11.5"]

[tool.setuptools.packages.find]
include = ["ig_storage*"]
