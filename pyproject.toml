[project]
name = "ig-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "openai==3.5.0",
    "python-dotenv==1.2.3",
    "SQLAlchemy",
    "PyMySQL",
    "alembic",
    "google-auth",
    "requests",
    "pwdlib[argon2]",
    "email-validator",
    "psycopg[binary]",
    "vercel-queue==0.9.1",
    "vercel==0.11.5",
    "redis>=8.1,<9",
    "rq>=2.12,<3",
    "python-multipart>=0.0.20",
    "cryptography>=46,<47",
    "PyJWT[crypto]==2.15.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
    "alembic*",
    "frontend*",
    "output*",
]

[tool.vercel]
entrypoint = "app.main:app"

[[tool.vercel.subscribers]]
entrypoint = "app.jobs.vercel_subscriber"
topics = ["ig-jobs"]